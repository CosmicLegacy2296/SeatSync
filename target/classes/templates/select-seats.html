<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Select Seats - ' + ${monthName} + ' 2026'">Select Seats</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Office Seat Booking System</h1>
            <div class="user-info">
                <span>Welcome, <strong th:text="${username}"></strong></span>
                <a th:href="@{/calendar/{month}(month=${month})}" class="btn btn-secondary">Back to Calendar</a>
                <a th:href="@{/logout}" class="btn btn-secondary">Logout</a>
            </div>
        </div>
        
        <div class="content">
            <h2 th:text="'Select Seats for ' + ${monthName} + ' 2026'"></h2>
            
            <div class="selected-dates-info">
                <h3>Selected Dates:</h3>
                <div id="selectedDatesDisplay" class="selected-dates-list"></div>
            </div>
            
            <div class="seat-selection-section">
                <div th:each="floor : ${floors}" th:if="${floor.hasSeats}">
                    <h3 th:text="'Floor ' + ${floor.floorNumber}"></h3>
                    <p class="info-text" th:text="${editMode} ? 'Click on a seat to change your booking for this date.' : 'Click on a seat to assign it to the next unassigned date.'"></p>
                    
                    <div class="seat-grid">
                        <div th:each="seat : ${floor.seats}" 
                             class="seat-item"
                             th:classappend="${bookedSeats != null and bookedSeats.contains(seat)} ? ' booked-seat' : ''"
                             th:data-seat-id="${seat}"
                             th:data-floor="${floor.floorNumber}"
                             onclick="selectSeat(this, this.getAttribute('data-seat-id'), this.getAttribute('data-floor'))">
                            <span th:text="${seat}"></span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="booking-assignments">
                <h3>Date-Seat Assignments</h3>
                <div id="assignmentsList" class="assignments-list"></div>
                <button id="confirmBookingBtn" class="btn btn-primary" onclick="confirmBookings()" disabled>
                    <span th:text="${editMode} ? 'Update Booking' : 'Confirm All Bookings'"></span>
                </button>
            </div>
        </div>
    </div>
    
    <script th:inline="javascript">
        /* Thymeleaf provides these variables safely to JS */
        const month = /*[[${month}]]*/ 2;
        const selectedDatesParam = /*[[${selectedDates}]]*/ '';
        const selectedDates = selectedDatesParam ? selectedDatesParam.split(',') : [];
        const editMode = /*[[${editMode}]]*/ false;
        const currentBooking = /*[[${currentBooking}]]*/ null;
        const dateSeatAssignments = {};
        
        // Preload current booking in edit mode
        if (editMode && currentBooking && currentBooking.date && currentBooking.seatId) {
            const dateStr = typeof currentBooking.date === 'string' ? currentBooking.date : currentBooking.date.toString();
            dateSeatAssignments[dateStr] = {
                seatId: currentBooking.seatId,
                floor: currentBooking.floor
            };
        }
        
        // Display selected dates
        const datesDisplay = document.getElementById('selectedDatesDisplay');
        if (selectedDates.length > 0) {
            datesDisplay.innerHTML = selectedDates.map(date => {
                return `<span class="date-tag">${date}</span>`;
            }).join('');
        } else {
            datesDisplay.innerHTML = '<p class="no-selection">No dates selected. Please go back to calendar.</p>';
        }

        function formatDateLabel(dateStr) {
            const [year, monthStr, dayStr] = dateStr.split('-').map(Number);
            const d = new Date(year, monthStr - 1, dayStr);
            return d.toLocaleDateString('en-US', {
                weekday: 'long',
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
        }
        
        function selectSeat(element, seatId, floor) {
            if (selectedDates.length === 0) {
                alert('No dates selected. Please go back to calendar.');
                return;
            }

            // If this seat is already booked for the selected date, do not allow selection
            if (element && element.classList.contains('booked-seat')) {
                const dateStr = selectedDates.length > 0 ? selectedDates[0].trim() : null;
                const label = dateStr ? formatDateLabel(dateStr) : 'This date';
                alert(`${label}, ${seatId} is already booked. Please select another seat for ${label}.`);
                return;
            }

            // Visually mark the clicked seat as selected
            document.querySelectorAll('.seat-item').forEach(el => {
                el.classList.remove('seat-selected');
            });
            if (element) {
                element.classList.add('seat-selected');
            }
            
            // Find first unassigned date
            let unassignedDate = selectedDates.find(date => !dateSeatAssignments[date]);
            
            if (!unassignedDate) {
                // All selected dates already have a seat assigned locally.
                // In edit mode or normal mode, allow user to change seat for the last selected date.
                const targetDate = selectedDates[selectedDates.length - 1].trim();
                const targetLabel = formatDateLabel(targetDate);
                const confirmChange = confirm(
                    `${targetLabel} already has a seat assigned.\n\n` +
                    `Would you like to change your seat for ${targetLabel} to ${seatId}?`
                );
                if (!confirmChange) {
                    // Do not change existing assignment
                    return;
                }

                // Replace assignment for that date
                dateSeatAssignments[targetDate] = {seatId: seatId, floor: parseInt(floor)};
                updateAssignmentsList();
                return;
            }

            // Assign seat for the first available date
            dateSeatAssignments[unassignedDate] = {seatId: seatId, floor: parseInt(floor)};
            updateAssignmentsList();
        }
        
        function removeAssignment(date) {
            delete dateSeatAssignments[date];
            updateAssignmentsList();
        }
        
        function updateAssignmentsList() {
            const assignmentsList = document.getElementById('assignmentsList');
            const confirmBtn = document.getElementById('confirmBookingBtn');
            
            if (Object.keys(dateSeatAssignments).length === 0) {
                assignmentsList.innerHTML = '<p class="no-selection">No assignments yet. Click on a seat to assign it to a date.</p>';
                confirmBtn.disabled = true;
            } else {
                let html = '<table class="assignments-table"><thead><tr><th>Date</th><th>Floor</th><th>Seat</th><th>Action</th></tr></thead><tbody>';
                
                Object.entries(dateSeatAssignments).sort().forEach(([date, assignment]) => {
                    html += `<tr>
                        <td>${date}</td>
                        <td>Floor ${assignment.floor}</td>
                        <td>${assignment.seatId}</td>
                        <td><button class="btn btn-danger btn-sm" onclick="removeAssignment('${date}')">Remove</button></td>
                    </tr>`;
                });
                
                html += '</tbody></table>';
                assignmentsList.innerHTML = html;
                
                // Enable confirm button if all dates are assigned
                confirmBtn.disabled = selectedDates.length !== Object.keys(dateSeatAssignments).length;
            }
        }
        
        async function confirmBookings() {
            if (Object.keys(dateSeatAssignments).length !== selectedDates.length) {
                alert('Please assign a seat to all selected dates before confirming.');
                return;
            }
            
            const confirmMessage = editMode 
                ? 'Are you sure you want to update this booking?'
                : 'Are you sure you want to confirm these bookings?';
            
            if (!confirm(confirmMessage)) {
                return;
            }
            
            // Disable button to prevent double submission
            const btn = document.getElementById('confirmBookingBtn');
            btn.disabled = true;
            btn.textContent = 'Processing...';
            
            // Submit each booking sequentially
            const assignments = Object.entries(dateSeatAssignments);
            let successCount = 0;
            let errorCount = 0;
            
            for (const [date, assignment] of assignments) {
                try {
                    const formData = new FormData();
                    formData.append('month', month);
                    formData.append('date', date);
                    formData.append('floor', assignment.floor);
                    formData.append('seatId', assignment.seatId);
                    if (editMode) {
                        formData.append('editMode', 'true');
                    }
                    
                    const response = await fetch('/book', {
                        method: 'POST',
                        body: formData,
                        redirect: 'manual' // Don't follow redirects automatically
                    });
                    
                    if (response.ok || response.status === 302) {
                        successCount++;
                    } else {
                        errorCount++;
                    }
                } catch (error) {
                    console.error('Error submitting booking:', error);
                    errorCount++;
                }
            }
            
            // Redirect to calendar page
            if (errorCount === 0) {
                window.location.href = `/calendar/${month}`;
            } else {
                alert(`Bookings completed.`);
                window.location.href = `/calendar/${month}`;
            }
        }
        
        // Initialize
        updateAssignmentsList();
        
        // In edit mode, preselect the current seat visually
        if (editMode && currentBooking && currentBooking.seatId) {
            const currentSeatElement = document.querySelector(`[data-seat-id="${currentBooking.seatId}"]`);
            if (currentSeatElement) {
                currentSeatElement.classList.add('seat-selected');
            }
        }
    </script>
</body>
</html>
