<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Calendar - ' + ${monthName} + ' 2026'">Calendar</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Seat Sync</h1>
            <div class="user-info">
                <span>Welcome, <strong th:text="${username}"></strong></span>
                <a th:href="@{/dashboard}" class="btn btn-secondary">Back to Dashboard</a>
                <a th:href="@{/logout}" class="btn btn-secondary">Logout</a>
            </div>
        </div>
        
        <div class="content">
            <h2 th:text="${monthName} + ' 2026'"></h2>
            
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            
            <div th:if="${validation}" class="validation-box" th:classappend="${validation.valid} ? 'valid' : 'invalid'">
                <p th:text="${validation.message}"></p>
            </div>
            
            <div class="booking-info" style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
                <p><strong>Your Bookings:</strong> <span th:text="${#lists.size(userBookings)}"></span> / <span th:text="${maxAllowedDays}"></span> (Minimum required: 6)</p>
                <button th:if="${maxAllowedDays == 10}" type="button" class="btn btn-secondary" onclick="document.getElementById('extensionModal').style.display='flex'">Request More Days</button>
            </div>

            <div id="extensionModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center; flex-direction:column;" onclick="if(event.target===this) this.style.display='none'">
                <div style="background:#0f172a; padding:24px; border-radius:12px; min-width:320px;">
                    <h3 style="margin-top:0;">Request Extension</h3>
                    <form th:action="@{/request-extension}" method="post">
                        <input type="hidden" name="month" th:value="${month}">
                        <input type="hidden" name="year" th:value="${year}">
                        <label for="requestedDays" style="display:block; margin-bottom:8px;">Number of days requested</label>
                        <input type="number" id="requestedDays" name="requestedDays" th:min="11" th:max="${daysInMonth}" required style="width:100%; padding:8px; margin-bottom:12px; border-radius:6px; border:1px solid rgba(148,163,184,0.6); background:#020617; color:#e5e7eb;">
                        <p class="info-text" style="margin-bottom:12px; font-size:13px;">Must be &gt; 10 and &le; <span th:text="${daysInMonth}"></span> (days in month)</p>
                        <div style="display:flex; gap:8px;">
                            <button type="submit" class="btn btn-primary">Submit</button>
                            <button type="button" class="btn btn-secondary" onclick="document.getElementById('extensionModal').style.display='none'">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
            
            <div class="calendar-section">
                <h3>Select Dates</h3>
                <p class="info-text">Click on dates to select them. You can select up to <span th:text="${maxAllowedDays}"></span> dates.</p>
                
                <div class="calendar-grid">
                    <div class="calendar-day" th:each="date : ${availableDates}"
                         th:data-date="${date.toString()}"
                         th:classappend="${#lists.contains(userBookings.![date], date)} ? 'booked' : ''"
                         onclick="toggleDate(this.getAttribute('data-date'))">
                        <div class="day-number" th:text="${date.getDayOfMonth()}"></div>
                        <div class="day-name" th:text="${date.getDayOfWeek().toString().substring(0,3)}"></div>
                        <div th:if="${#lists.contains(userBookings.![date], date)}" class="booked-badge">Booked</div>
                    </div>
                </div>
                
                <div class="selected-dates-section">
                    <h4>Selected Dates:</h4>
                    <div id="selectedDatesList" class="selected-dates-list"></div>
                    <button id="selectSeatsBtn" class="btn btn-primary" onclick="proceedToSeatSelection()" disabled>
                        Select Seats for Selected Dates
                    </button>
                </div>
            </div>
            
            <div class="existing-bookings-section" th:if="${!#lists.isEmpty(userBookings)}">
                <h3>Your Current Bookings</h3>
                <table class="bookings-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Day</th>
                            <th>Floor</th>
                            <th>Seat</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="booking : ${userBookings}">
                            <td th:text="${#temporals.format(booking.date, 'MMM dd, yyyy')}"></td>
                            <td th:text="${booking.date.getDayOfWeek()}"></td>
                            <td th:text="'Floor ' + ${booking.floor}"></td>
                            <td th:text="${booking.seatId}"></td>
                            <td>
                                <form th:action="@{/delete-booking}" method="post" style="display: inline;">
                                    <input type="hidden" name="month" th:value="${month}">
                                    <input type="hidden" name="date" th:value="${booking.date.toString()}">
                                    <input type="hidden" name="seatId" th:value="${booking.seatId}">
                                    <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure?')">Delete</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script th:inline="javascript">
        /* Thymeleaf provides these variables safely to JS */
        const month = /*[[${month}]]*/ 2;
        const maxAllowedDays = /*[[${maxAllowedDays}]]*/ 10;
        const userBookings = /*[[${userBookings}]]*/ [];
        
        let selectedDates = new Set();
        
        function toggleDate(dateStr) {
            const dateElement = document.querySelector(`[data-date="${dateStr}"]`);
            if (!dateElement) return;

            if (dateElement.classList.contains('booked')) {
                const confirmEdit = confirm('Would you like to edit this date?');
                if (confirmEdit) {
                    window.location.href = `/start-seat-selection?month=${month}&editDate=${encodeURIComponent(dateStr)}`;
                }
                return;
            }
            
            if (selectedDates.has(dateStr)) {
                selectedDates.delete(dateStr);
                dateElement.classList.remove('selected');
            } else {
                if (selectedDates.size >= maxAllowedDays) {
                    alert('Limit: ' + maxAllowedDays + ' dates.');
                    return;
                }
                selectedDates.add(dateStr);
                dateElement.classList.add('selected');
            }
            updateSelectedDatesList();
        }
        
        function updateSelectedDatesList() {
            const listDiv = document.getElementById('selectedDatesList');
            const btn = document.getElementById('selectSeatsBtn');
            
            if (selectedDates.size === 0) {
                listDiv.innerHTML = '<p class="no-selection">No dates selected</p>';
                btn.disabled = true;
            } else {
                const datesArray = Array.from(selectedDates).sort();
                listDiv.innerHTML = datesArray.map(d => `<span class="date-tag">${d}</span>`).join('');
                btn.disabled = false;
            }
        }
        
        function proceedToSeatSelection() {
            const datesParam = Array.from(selectedDates).join(',');
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/start-seat-selection';
            const monthInput = document.createElement('input');
            monthInput.type = 'hidden';
            monthInput.name = 'month';
            monthInput.value = month;
            const datesInput = document.createElement('input');
            datesInput.type = 'hidden';
            datesInput.name = 'selectedDates';
            datesInput.value = datesParam;
            form.appendChild(monthInput);
            form.appendChild(datesInput);
            document.body.appendChild(form);
            form.submit();
        }

        // Run on load - initialize with empty selection state
        updateSelectedDatesList();
    </script>
</body>
</html>
