<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your SubSync Account - SeatSync</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-wrapper" style="padding-top: 40px; padding-bottom: 40px;">
    <div class="card login-box" style="max-width: 600px; padding: 40px; position: relative;">
        <a th:href="@{/}" class="login-close-btn" title="Back to Landing Page">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </a>
        <div class="login-header" style="margin-bottom: 24px; display: flex; flex-direction: column; align-items: center;">
            <a th:href="@{/}" class="logo-icon" style="text-decoration: none; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); margin-bottom: 16px;">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
                </svg>
            </a>
            <div>
                <h1 class="logo-text" style="text-align: center;">Create Your SubSync Account</h1>
                <p style="text-align: center;">Create your SubSync account, then join using an invite code</p>
            </div>
        </div>

        <div th:if="${error}" class="alert alert-error" style="margin-bottom: 20px;">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span th:text="${error}">Error</span>
        </div>

        <div th:if="${success}" class="alert alert-success" style="margin-bottom: 20px;">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <span th:text="${success}">Success</span>
        </div>

        <form th:action="@{/employee-signup}" method="post">
            <div class="form-group">
                <label class="form-label" for="fullName">Full Name *</label>
                <input class="form-control" id="fullName" name="fullName" type="text" required placeholder="Jane Doe">
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email Address *</label>
                <input class="form-control" id="email" name="email" type="email" required placeholder="jane@company.com">
                <span class="form-hint">This will be your primary login credential.</span>
            </div>

            <div class="form-group">
                <label class="form-label" for="displayName">Display Name *</label>
                <input class="form-control" id="displayName" name="displayName" type="text" required placeholder="jane">
                <span class="form-hint">Your friendly name shown in sidebar, calendars, and bookings.</span>
            </div>

            <div class="form-group" style="position: relative;">
                <label class="form-label" for="password">Password *</label>
                <input class="form-control" id="password" name="password" type="password" required placeholder="At least 8 characters">
                <span id="pwdError" style="color:#e74c3c;font-size:12px;margin-top:4px;display:none;">Password must be at least 8 characters.</span>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirm Password *</label>
                <input class="form-control" id="confirmPassword" name="confirmPassword" type="password" required placeholder="Re-enter password">
                <span id="confirmError" style="color:#e74c3c;font-size:12px;margin-top:4px;display:none;">Passwords do not match.</span>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 18px;">
                Create SubSync Account & Continue
            </button>
        </form>

        <div style="text-align: center; margin-top: 22px;">
            <a th:href="@{/login}" class="form-link">&larr; Back to Login</a>
        </div>
    </div>
</div>
</body>
<script>
    document.querySelector('form').addEventListener('submit', function(e) {
        const pwd = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;
        let block = false;
        if (pwd.length < 8) {
            e.preventDefault();
            document.getElementById('pwdError').style.display = 'block';
            block = true;
        } else {
            document.getElementById('pwdError').style.display = 'none';
        }
        if (pwd !== confirm) {
            e.preventDefault();
            document.getElementById('confirmError').style.display = 'block';
            block = true;
        } else {
            document.getElementById('confirmError').style.display = 'none';
        }
        if (block) document.getElementById('password').focus();
    });
</script>
</html>
