<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Bookings - SeatSync</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a th:href="@{/dashboard}" class="sidebar-logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6-2zm0 8h2v2h-2z"/>
                    </svg>
                </div>
                <span class="logo-text">SeatSync</span>
            </a>
            
            <nav class="sidebar-nav">
                <a th:href="@{/dashboard}" class="nav-link">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <rect x="3" y="3" width="7" height="9"></rect>
                        <rect x="14" y="3" width="7" height="5"></rect>
                        <rect x="14" y="12" width="7" height="9"></rect>
                        <rect x="3" y="16" width="7" height="5"></rect>
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-link active">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <span>Review Bookings</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-profile-badge">
                    <div class="user-avatar" th:text="${#strings.substring(displayName, 0, 1).toUpperCase()}">U</div>
                    <div class="user-details">
                        <span class="user-name" th:text="${displayName}">username</span>
                        <span class="user-role">Employee</span>
                    </div>
                </div>
                <a th:href="@{/logout}" class="btn btn-secondary btn-sm btn-block" style="margin-top: 12px; justify-content: center;">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Log Out</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container" style="max-width: 900px;">
                <div style="margin-bottom: 32px;">
                    <h1 style="font-size: 32px; font-weight: 800; margin-bottom: 8px;">Review Bookings</h1>
                    <p style="color: var(--text-secondary); max-width: 700px;" th:text="${editMode} ? 'Review your seat change. Click Confirm to save.' : 'Review your seat selections. Click Confirm to save all bookings.'">
                        Review your seat selections. Click Confirm to save all bookings.
                    </p>
                </div>

                <div class="table-container" style="margin-bottom: 32px; overflow: hidden; border: 1px solid var(--accent-primary); box-shadow: 0 0 20px rgba(74, 222, 128, 0.1);">
                    <div style="background: linear-gradient(135deg, rgba(74, 222, 128, 0.1), rgba(34, 197, 94, 0.1)); padding: 20px 24px; border-bottom: 1px solid var(--border-color);">
                        <h3 style="font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px;">
                            <svg width="20" height="20" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                                <line x1="16" y1="13" x2="8" y2="13"></line>
                                <line x1="16" y1="17" x2="8" y2="17"></line>
                                <polyline points="10 9 9 9 8 9"></polyline>
                            </svg>
                            Pending Reservations
                        </h3>
                    </div>
                    <table class="styled-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Floor</th>
                                <th>Seat</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="row : ${rows}" th:classappend="'floor-' + ${row.floor} + '-row'">
                                <td><strong th:text="${#temporals.format(row.date, 'EEEE, MMM dd, yyyy')}"></strong></td>
                                <td><span class="month-stats-badge" style="margin: 0; padding: 4px 8px; font-size: 12px;" th:text="'Floor ' + ${row.floor}"></span></td>
                                <td><code style="background: rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 4px; color: var(--accent-primary); font-weight: bold;" th:text="${row.seatId}"></code></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="flex-between">
                    <a th:href="@{/select-seat(index=${totalDates} - 1)}" class="btn btn-secondary">
                        &larr; Go Back to Edit
                    </a>
                    
                    <form th:action="@{/confirm-booking}" method="post" style="display: inline;" onsubmit="return handleConfirm(this)">
                        <button type="submit" class="btn btn-primary" style="padding-left: 32px; padding-right: 32px; font-size: 16px;">
                            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" style="margin-right: 4px;">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                            Confirm Bookings
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        function handleConfirm(form) {
            const btn = form.querySelector('button');
            btn.innerHTML = `
                <svg class="animate-spin" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right: 8px; animation: spin 1s linear infinite;">
                    <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
                </svg>
                Processing...
            `;
            btn.disabled = true;
            btn.style.opacity = '0.8';
            
            // Add keyframes if not exists
            if (!document.getElementById('spin-keyframes')) {
                const style = document.createElement('style');
                style.id = 'spin-keyframes';
                style.textContent = '@keyframes spin { 100% { transform: rotate(360deg); } }';
                document.head.appendChild(style);
            }
            
            return true;
        }
    </script>
</body>
</html>
