<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Bookings</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Seat Sync</h1>
            <div class="user-info">
                <span>Welcome, <strong th:text="${username}"></strong></span>
                <a th:href="@{/logout}" class="btn btn-secondary">Logout</a>
            </div>
        </div>

        <div class="content">
            <h2>Review Your Bookings</h2>
            <p class="info-text" th:text="${editMode} ? 'Review your seat change. Click Confirm to save.' : 'Review your seat selections. Click Confirm to save all bookings.'"></p>

            <table class="bookings-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Floor</th>
                        <th>Seat</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="row : ${rows}">
                        <td th:text="${#temporals.format(row.date, 'EEEE, MMM dd, yyyy')}"></td>
                        <td th:text="'Floor ' + ${row.floor}"></td>
                        <td th:text="${row.seatId}"></td>
                    </tr>
                </tbody>
            </table>

            <div class="review-buttons">
                <a th:href="@{/select-seat(index=${totalDates} - 1)}" class="btn btn-secondary">Go Back</a>
                <form th:action="@{/confirm-booking}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-primary">Confirm</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
