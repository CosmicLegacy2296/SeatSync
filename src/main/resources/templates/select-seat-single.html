<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Select Seat - ' + ${#temporals.format(currentDate, 'MMM dd, yyyy')}">Select Seat</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a th:href="@{/dashboard}" class="sidebar-logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6-2zm0 8h2v2h-2z"/>
                    </svg>
                </div>
                <span class="logo-text">SeatSync</span>
            </a>
            
            <nav class="sidebar-nav">
                <a th:href="@{/dashboard}" class="nav-link">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <rect x="3" y="3" width="7" height="9"></rect>
                        <rect x="14" y="3" width="7" height="5"></rect>
                        <rect x="14" y="12" width="7" height="9"></rect>
                        <rect x="3" y="16" width="7" height="5"></rect>
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a th:href="@{'/calendar/' + ${month}}" class="nav-link">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <span>Calendar</span>
                </a>
                <a href="#" class="nav-link active">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                    <span>Desk Selection</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-profile-badge">
                    <div class="user-avatar" th:text="${#strings.substring(displayName, 0, 1).toUpperCase()}">U</div>
                    <div class="user-details">
                        <span class="user-name" th:text="${displayName}">username</span>
                        <span class="user-role">Employee</span>
                    </div>
                </div>
                <a th:href="@{/logout}" class="btn btn-secondary btn-sm btn-block" style="margin-top: 12px; justify-content: center;">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Log Out</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container" style="max-width: 900px;">
                
                <div class="flex-between" style="margin-bottom: 24px; align-items: flex-start;">
                    <div>
                        <a th:href="@{'/calendar/' + ${month}}" style="color: var(--text-secondary); text-decoration: none; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 8px;">
                            &larr; Cancel and return to Calendar
                        </a>
                        <h1 style="font-size: 28px; line-height: 1.2;">
                            Select a seat for <br>
                            <span class="text-gradient" th:text="${#temporals.format(currentDate, 'EEEE, MMM dd, yyyy')}">Date</span>
                        </h1>
                        <p style="color: var(--text-secondary); margin-top: 8px;">
                            Booking <strong th:text="${index + 1}"></strong> of <strong th:text="${totalDates}"></strong>
                        </p>
                    </div>
                    
                    <div>
                        <button type="button" class="btn btn-secondary" onclick="autoAssignSeat()">
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                            </svg>
                            Auto-Assign
                        </button>
                    </div>
                </div>

                <div class="card" style="padding: 32px; margin-bottom: 32px;">
                    <div th:each="floor : ${floors}" th:if="${floor.hasSeats}" style="margin-bottom: 40px;">
                        <h3 th:text="'Floor ' + ${floor.floorNumber}" style="margin-bottom: 16px; font-size: 20px; color: var(--text-primary); border-bottom: 1px solid var(--border-color); padding-bottom: 8px;"></h3>
                        <div class="seat-grid">
                            <div th:each="seat : ${floor.seats}"
                                 class="seat-item"
                                 th:classappend="${(bookedSeats != null and bookedSeats.contains(seat) ? ' booked-seat' : '') + (existingSeatId != null and existingSeatId == seat ? ' seat-selected' : '')}"
                                 th:data-seat-id="${seat}"
                                 th:data-floor="${floor.floorNumber}"
                                 th:data-date-label="${#temporals.format(currentDate, 'EEEE, MMM dd, yyyy')}"
                                 onclick="handleSeatClick(this)">
                                 
                                <svg th:if="${bookedSeats == null or !bookedSeats.contains(seat)}" viewBox="0 0 24 24">
                                    <rect x="2" y="10" width="20" height="8" rx="2" ry="2"></rect>
                                    <path d="M6 10V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v4"></path>
                                    <line x1="6" y1="18" x2="6" y2="22"></line>
                                    <line x1="18" y1="18" x2="18" y2="22"></line>
                                </svg>
                                
                                <svg th:if="${bookedSeats != null and bookedSeats.contains(seat)}" viewBox="0 0 24 24">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                                
                                <div class="seat-label" th:text="${seat}"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <form id="seatForm" th:action="@{/select-seat}" method="post">
                    <input type="hidden" name="index" th:value="${index}">
                    <input type="hidden" name="floor" id="hiddenFloor">
                    <input type="hidden" name="seatId" id="hiddenSeatId">

                    <div class="flex-between" style="border-top: 1px solid var(--border-color); padding-top: 24px;">
                        <div>
                            <a th:if="${index > 0}" th:href="@{/select-seat(index=${index} - 1)}" class="btn btn-secondary">
                                &larr; Back
                            </a>
                        </div>
                        <div>
                            <button type="button" class="btn btn-primary" id="submitSeatBtn" onclick="submitSeat()" disabled>
                                <span th:if="${index < totalDates - 1}">Next Date &rarr;</span>
                                <span th:if="${index == totalDates - 1}">Review Bookings &rarr;</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script th:inline="javascript">
        const selectedSeat = {
            floor: /*[[${existingFloor}]]*/ null,
            seatId: /*[[${existingSeatId}]]*/ null
        };

        function handleSeatClick(el) {
            if (el.classList.contains('booked-seat')) {
                const dateLabel = el.getAttribute('data-date-label') || 'This date';
                const seatId = el.getAttribute('data-seat-id');
                
                // Show toast notification instead of alert for better UX
                const toastContainer = document.querySelector('.toast-container') || createToastContainer();
                const toast = document.createElement('div');
                toast.className = 'toast alert-error';
                toast.style.animation = 'slideIn 0.3s ease-out forwards';
                toast.innerHTML = `
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span>${seatId} is already booked for ${dateLabel}.</span>
                `;
                toastContainer.appendChild(toast);
                setTimeout(() => toast.remove(), 4000);
                
                return;
            }
            document.querySelectorAll('.seat-item').forEach(e => {
                e.classList.remove('seat-selected');
                // Remove checkmark if any
                const checkmark = e.querySelector('.checkmark-icon');
                if (checkmark) checkmark.remove();
            });
            el.classList.add('seat-selected');
            
            // Add checkmark icon to selected seat
            const checkIcon = document.createElement('div');
            checkIcon.className = 'checkmark-icon';
            checkIcon.style.position = 'absolute';
            checkIcon.style.top = '-8px';
            checkIcon.style.right = '-8px';
            checkIcon.style.background = 'var(--color-success)';
            checkIcon.style.borderRadius = '50%';
            checkIcon.style.padding = '2px';
            checkIcon.style.boxShadow = '0 0 10px rgba(0,0,0,0.5)';
            checkIcon.innerHTML = `<svg width="16" height="16" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
            el.style.position = 'relative';
            el.appendChild(checkIcon);
            
            selectedSeat.floor = parseInt(el.getAttribute('data-floor'));
            selectedSeat.seatId = el.getAttribute('data-seat-id');
            document.getElementById('hiddenFloor').value = selectedSeat.floor;
            document.getElementById('hiddenSeatId').value = selectedSeat.seatId;
            document.getElementById('submitSeatBtn').disabled = false;
        }

        function createToastContainer() {
            const container = document.createElement('div');
            container.className = 'toast-container';
            document.body.appendChild(container);
            return container;
        }

        function autoAssignSeat() {
            // Find first unbooked seat
            const availableSeats = document.querySelectorAll('.seat-item:not(.booked-seat)');
            if (availableSeats.length > 0) {
                // Click the first one to select it
                handleSeatClick(availableSeats[0]);
                // Scroll to the selected seat
                availableSeats[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
                alert('No seats available for this date.');
            }
        }

        function submitSeat() {
            if (!selectedSeat.floor || !selectedSeat.seatId) {
                alert('Please select a seat.');
                return;
            }
            document.getElementById('seatForm').submit();
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (selectedSeat.floor != null && selectedSeat.seatId != null) {
                document.getElementById('hiddenFloor').value = selectedSeat.floor;
                document.getElementById('hiddenSeatId').value = selectedSeat.seatId;
                document.getElementById('submitSeatBtn').disabled = false;
                
                // Re-add checkmark on page load for existing selected seat
                const selectedEl = document.querySelector('.seat-selected');
                if(selectedEl) {
                    const checkIcon = document.createElement('div');
                    checkIcon.className = 'checkmark-icon';
                    checkIcon.style.position = 'absolute';
                    checkIcon.style.top = '-8px';
                    checkIcon.style.right = '-8px';
                    checkIcon.style.background = 'var(--color-success)';
                    checkIcon.style.borderRadius = '50%';
                    checkIcon.style.padding = '2px';
                    checkIcon.style.boxShadow = '0 0 10px rgba(0,0,0,0.5)';
                    checkIcon.innerHTML = `<svg width="16" height="16" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
                    selectedEl.style.position = 'relative';
                    selectedEl.appendChild(checkIcon);
                }
            }
        });
    </script>
</body>
</html>
