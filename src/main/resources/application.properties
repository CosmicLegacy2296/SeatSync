spring.application.name=SeatSync
server.port=${PORT:8080}
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
spring.devtools.restart.enabled=true
spring.config.import=optional:file:.env[.properties]

# --- Persistence (dev) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:jdbc:h2:file:./seatSync-db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:${JDBC_DATABASE_DRIVER:${DATABASE_DRIVER:org.h2.Driver}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${JDBC_DATABASE_USERNAME:${DATABASE_USERNAME:sa}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${JDBC_DATABASE_PASSWORD:${DATABASE_PASSWORD:}}}

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.sql.init.separator=@@

# Ensure Hibernate/JPA resolves unqualified table names from the SeatSync schema
spring.jpa.properties.hibernate.default_schema=seatsync

spring.jpa.show-sql=false
